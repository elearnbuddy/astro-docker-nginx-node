pcre_jit on;

worker_processes 1;

worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept off;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- PERFORMANCE OPTIMIZATIONS ---
    access_log off;
    # Reduce logging noise to save IO/CPU
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Allow the server to close the connection after a client stops responding
    reset_timedout_connection on;

    # BUFFER TUNING (Drastically increased to keep requests in RAM and avoid Disk I/O)
    # Previous 10K was too small for modern apps/actions, causing disk writes.
    client_body_buffer_size 512k;
    client_max_body_size 50M;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # PROXY BUFFERING (Critical for Node.js communication)
    # Without this, Nginx writes Node responses to disk before sending to client.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # TIMEOUTS (Close stuck connections quickly to free up the worker)
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65; # Increased slightly to match browser defaults better
    keepalive_requests 1000; # Allow more requests per connection
    send_timeout 10;

    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --- PRECOMPRESSION SETTINGS ---
    gzip_static on;
    gzip off;

    upstream astro_node {
        # Matches your port 4000 setting
        server 127.0.0.1:4000;
        keepalive 64;
    }

    server {
        # Matches your port 3000 setting
        listen 3000;
        root /usr/share/nginx/html;

        # 1. Astro Assets
        location /_astro/ {
            alias /usr/share/nginx/html/_astro/;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 2. Static Assets
        # JIT is enabled globally, making this regex check much faster
        location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|json|xml|map|webmanifest|woff|woff2|ttf|eot)$ {
            expires 1d;
            try_files $uri =404;
        }

        # 3. EXPLICIT DYNAMIC ROUTES

        # API Routes
        location /api/ {
            proxy_pass http://astro_node;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Server Islands (Dynamic Components)
        location /_server-islands/ {
            proxy_pass http://astro_node;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Astro Actions (Specific Endpoint)
        location /_actions/ {
            proxy_pass http://astro_node;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # 4. Main Page Handler (STRICT STATIC)
        location / {
            # ACTION SUPPORT:
            if ($request_method = POST) {
                return 418;
            }

            # STRICT STATIC SERVING:
            try_files $uri $uri/index.html $uri.html =404;
        }

        # 5. Proxy Handler (For POST requests caught by 418)
        location @node {
            add_header X-Served-By "NodeJS-Proxy" always;
            proxy_pass http://astro_node;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 418 = @node;
    }
}